<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FAF9F6">
<link rel="icon" href="art/logo-wordgames.svg">
<title>Word games</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#FAF9F6;color:#292015;display:flex;justify-content:center}
main{width:min(100vw,520px);padding:24px 16px}
h1{display:flex;align-items:center;gap:12px;font-family:Georgia,'Times New Roman',serif;font-size:30px;margin:0 0 6px}
h1 img{width:48px;height:48px}
p{color:#655B50;margin:0 0 18px}
a.card,div.card{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #E6E0D7;border-radius:14px;padding:14px;margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card img{width:56px;height:56px;flex:none}
.card b{display:block;font-family:Georgia,'Times New Roman',serif;font-size:21px}
.card span{font-size:14px;color:#655B50}
div.card{opacity:.55}
</style>
</head>
<body>
<main>
  <h1><img src="art/logo-wordgames.svg" alt="">Word games</h1>
  <p>Play against the computer. No ads, no tracking, works offline.</p>
  <a class="card" href="masterword/"><img src="art/logo-masterword.svg" alt=""><div><b>Masterword</b><span>The standard game: 15 x 15 board, 7 tiles.</span></div></a>
  <div class="card"><img src="art/logo-miniword.svg" alt=""><div><b>MiniWord</b><span>Coming soon: the quick game, 13 x 13 board, 6 tiles.</span></div></div>
  <div class="card"><img src="art/logo-bigword.svg" alt=""><div><b>Bigword</b><span>Coming soon: the long game, 17 x 17 board, 8 tiles.</span></div></div>
</main>
</body>
</html>
